services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.romm.entrypoints=https-internal,https-external"
      - "traefik.http.routers.romm.rule=Host(`emulation.${DOMAIN_BASE_01}`)"
      - "traefik.http.routers.romm.tls=true"
      - "traefik.http.routers.romm.tls.certresolver=production"
      - "traefik.http.services.romm.loadbalancer.server.port=8080"
      - "traefik.docker.network=servarr"
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm # Should match MARIADB_DATABASE in mariadb
      - DB_USER=romm-user # Should match MARIADB_USER in mariadb
      - DB_PASSWD=${ROMM_DB_PASSWD} # Should match MARIADB_PASSWORD in mariadb
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY} # Generate a key with `openssl rand -hex 32`
      - IGDB_CLIENT_ID=${ROMM_IGDB_CLIENT_ID} # Generate an ID and SECRET in IGDB
      - IGDB_CLIENT_SECRET=${ROMM_IGDB_CLIENT_SECRET} # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#igdb
      - MOBYGAMES_API_KEY= # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#mobygames
      - STEAMGRIDDB_API_KEY=${ROMM_STEAMGRIDDB_API_KEY} # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#steamgriddb
      - SCREENSCRAPER_USER=${ROMM_SCREENSCRAPER_USER} # Use your ScreenScraper username and password
      - SCREENSCRAPER_PASSWORD=${ROMM_SCREENSCRAPER_PASSWORD} # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#screenscraper
      - RETROACHIEVEMENTS_API_KEY=${ROMM_RETROACHIEVEMENTS_API_KEY} # https://api-docs.retroachievements.org/#api-access
      - HASHEOUS_API_ENABLED=true
      - PLAYMATCH_API_ENABLED=true
    volumes:
      - ./romm_resources:/romm/resources # Resources fetched from IGDB (covers, screenshots, etc.)
      - ./redis_data:/redis-data # Cached data for background tasks
      - /mnt/emulation/library:/romm/library # Your game library. Check https://github.com/rommapp/romm?tab=readme-ov-file#folder-structure for more details.
      - ./assets:/romm/assets # Uploaded saves, states, etc.
      - ./config:/romm/config # Path where config.yml is stored
    ports:
    #   - 80:8080
      - 2222:22
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true
    networks:
      - romm_backend
      - servarr

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${ROMM_MARIADB_ROOT_PASSWORD} # Use a unique, secure password
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${ROMM_MARIADB_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - romm_backend
networks:
  servarr:
    external: true
  romm_backend:
    external: true
