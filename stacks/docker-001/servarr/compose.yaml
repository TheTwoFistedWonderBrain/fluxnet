services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    labels:
      - "docker.stack=servarr"
      # - "com.centurylinklabs.watchtower.enable=true"
      # - "com.centurylinklabs.watchtower.scope=update"
      - "wud.watch=true"
      - "wud.trigger.include=discord.batch,docker.manual"
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.entrypoints=https-internal,https-external"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN_BASE_01}`)"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.tls.certresolver=production"
      - "traefik.http.routers.bazarr.middlewares=forwardAuth-authentik@file"
      - "traefik.http.routers.bazarr-internal-lunasea.entrypoints=https-internal-lunasea"
      - "traefik.http.routers.bazarr-internal-lunasea.rule=Host(`bazarr.${DOMAIN_BASE_01}`)"
      - "traefik.http.routers.bazarr-internal-lunasea.tls.certresolver=production"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    restart: unless-stopped
    volumes:
      - ./bazarr/config:/config
      - /mnt/data/media/tv:/media/tv
      - /mnt/data/media/movies:/media/movies
      - /mnt/data/media/anime/movies:/anime/movies
      - /mnt/data/media/anime/series:/anime/series
      - /mnt/data/media/web_series:/media/web_series
      - /mnt/docker_extras/backup/stacks/servarr/bazarr:/backup
    networks:
      - servarr
