    volumes:
      - ./wizarr/config/database:/data/database
      - ./wizarr/config/wizard:/data/wizard_steps
    environment:
      - PUID=1000 #Set UID
      - PGID=1000 #Set GID
      - DISABLE_BUILTIN_AUTH=false #Set to true ONLY if you are using another auth provider (Authelia, Authentik, etc)
      - TZ=America/Chicago #Set your timezone here
    labels:
      - "docker.stack=servarr"
      - "wud.watch=true"
      - "wud.trigger.include=discord.batch,docker.manual"
      - "traefik.enable=true"
      - "traefik.http.routers.wizarr.entrypoints=https-internal,https-external"
      - "traefik.http.routers.wizarr.rule=Host(`invites.${DOMAIN_BASE_01}`)"
      - "traefik.http.routers.wizarr.tls=true"
      - "traefik.http.routers.wizarr.tls.certresolver=production"
      - "traefik.http.services.wizarr.loadbalancer.server.port=5690"
    networks:
      - servarr
    restart: unless-stopped
networks:
  servarr:
    external: true
  # ldap:
  #   external: true
