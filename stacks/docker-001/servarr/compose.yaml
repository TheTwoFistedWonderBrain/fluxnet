  calendarr-weekly:
    image: ghcr.io/jordanlambrecht/calendarr:latest
    container_name: calendarr-weekly
    environment:
      TZ: America/Chicago
      USE_DISCORD: "true"
      DISCORD_WEBHOOK_URL: ${CALENDARR_DISCORD_WEBHOOK_WEEKLY_URL}
      CALENDAR_URLS: >
        [{
          "url":"${CALENDARR_ICS_URL_SONARR_1}",
          "type":"tv"
        },
        {
          "url":"${CALENDARR_ICS_URL_RADARR_1}",
          "type":"movie"
        }]
      START_WEEK_ON_MONDAY: "true"
      SCHEDULE_TYPE: WEEKLY
      SCHEDULE_DAY: "0"
      CALENDAR_RANGE: WEEK
      RUN_ON_STARTUP: "false"
      RUN_TIME: 06:00
      # CUSTOM_HEADER: "TV Guide - What's Up This Week"
    labels:
      - "docker.stack=servarr"
      # - "com.centurylinklabs.watchtower.enable=true"
      # - "com.centurylinklabs.watchtower.scope=update"
      - "wud.watch=true"
      - "wud.trigger.include=discord.batch,docker.manual"
    volumes:
      - ./calendarr/weekly/logs:/app/logs:rw
      - ./calendarr/weekly/custom_footers:/app/custom_footers:rw
    restart: unless-stopped
    networks:
      - servarr
