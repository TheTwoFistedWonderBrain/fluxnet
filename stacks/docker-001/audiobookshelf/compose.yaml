services:
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    # ports:
    #   - 13378:80
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.entrypoints=https-internal,https-external"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.${DOMAIN_BASE_01}`)"
      - "traefik.http.routers.audiobookshelf.tls=true"
      - "traefik.http.routers.audiobookshelf.tls.certresolver=production"
      # - "traefik.http.routers.mealie.middlewares=forwardAuth-authentik@file"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
    environment:
      - TZ=America/Chicago
    volumes:
      - /mnt/data/media/audiobooks:/audiobooks
      - /mnt/data/media/podcasts:/podcasts
      - ./config:/config
      - ./metadata:/metadata
    networks:
      - management
networks:
  management:
    external: true