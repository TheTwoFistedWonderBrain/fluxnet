  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    environment:
      -PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    labels:
      # - "com.centurylinklabs.watchtower.enable=true"
      # - "com.centurylinklabs.watchtower.scope=monitor"
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.entrypoints=https-internal"
      - "traefik.http.routers.portainer.rule=Host(`portainer.cookiecollective.net`)"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=production"
      - "traefik.http.services.portainer.loadbalancer.server.port=9443"
      - "traefik.http.services.portainer.loadbalancer.server.scheme=https"
      - "traefik.http.services.portainer.loadbalancer.passhostheader=true"
    volumes:
      - ./portainer/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - management
  unifi-os-server:
    image: ghcr.io/lemker/unifi-os-server:latest
    container_name: unifi-os-server
    privileged: true
    environment:
      - UOS_SYSTEM_IP=unifi.cookiecollective.net
    labels:
      # - "com.centurylinklabs.watchtower.enable=true"
      # - "com.centurylinklabs.watchtower.scope=monitor"
      - "traefik.enable=true"
      - "traefik.http.routers.unifi.entrypoints=https-internal,https-external"
      - "traefik.http.routers.unifi.rule=Host(`unifi.cookiecollective.net`)"
      - "traefik.http.routers.unifi.tls=true"
      # - "traefik.http.routers.unifi.tls.passthrough=true"
      - "traefik.http.routers.unifi.tls.certresolver=production"
      - "traefik.http.routers.unifi.service=unifi"
      - "traefik.http.services.unifi.loadbalancer.server.port=11443"
      - "traefik.http.services.unifi.loadbalancer.server.scheme=https"
      - "traefik.http.services.unifi.loadbalancer.passhostheader=true"
      - "traefik.docker.network=management"
    volumes:
      - ./unifi-os-server/persistent:/persistent
      - ./unifi-os-server/var-log:/var/log
      - ./unifi-os-server/data:/data
      - ./unifi-os-server/srv:/srv
      - ./unifi-os-server/var-lib-unifi:/var/lib/unifi
      - ./unifi-os-server/var-lib-mongodb:/var/lib/mongodb
      - ./unifi-os-server/etc-rabbitmq-ssl:/etc/rabbitmq/ssl
    ports:
      - 11443:443
      - 5005:5005 # Optional
      - 9543:9543 # Optional
      - 6789:6789 # Optional
      - 8080:8080
      - 8443:8443 # Optional
      - 8444:8444 # Optional
      - 3478:3478/udp
      - 5514:5514/udp # Optional
      - 10003:10003/udp
      - 11084:11084 # Optional
      - 5671:5671 # Optional
      - 8880:8880 # Optional
      - 8881:8881 # Optional
      - 8882:8882 # Optional
    restart: unless-stopped
    networks:
      - management
